name: check notes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse to publish a leak
        run: node scripts/guard.mjs CHANGELOG.md README.md CONTRIBUTING.md

      - name: Changelog is well formed
        run: |
          set -euo pipefail
          test -s CHANGELOG.md || { echo "CHANGELOG.md is missing or empty"; exit 1; }

          bad=$(grep -n '^## ' CHANGELOG.md | grep -vE '^[0-9]+:## [0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$bad" ]; then
            echo "Version headings must be '## MAJOR.MINOR.PATCH':"
            echo "$bad"
            exit 1
          fi

          versions=$(grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | sed 's/## //')
          sorted=$(printf '%s\n' "$versions" | sort -Vr)
          if [ "$versions" != "$sorted" ]; then
            echo "Versions are not in descending order."
            exit 1
          fi
          echo "OK: $(printf '%s\n' "$versions" | wc -l) versions, newest first"

      - name: Internal links resolve
        run: |
          set -euo pipefail
          for f in $(grep -ohE '\]\([^)#]+\.md\)' README.md CHANGELOG.md CONTRIBUTING.md \
                     | sed -E 's/.*\]\(([^)]+)\)/\1/' | sort -u); do
            test -f "$f" || { echo "Broken internal link: $f"; exit 1; }
          done
          echo "OK: internal links resolve"
